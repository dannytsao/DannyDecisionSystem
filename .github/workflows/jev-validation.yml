name: Jev Value Validation

on:
  push:
    branches: [jev-value-validation]
    # Report/plan edits consume existing artifacts; live providers run only
    # when the harness or workflow changes, or when manually dispatched.
    paths:
      - "tests/jev/**"
      - ".github/workflows/jev-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "tests/jev/**"
      - ".github/workflows/jev-validation.yml"
  workflow_dispatch:

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CI dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: python3 -m unittest -v tests/jev/test_harness.py
      - name: Golden fixture benchmark
        run: python3 tests/jev/benchmark.py --provider fixture --dataset golden
      - name: Historical fixture benchmark with language slices
        run: python3 tests/jev/benchmark.py --provider fixture --dataset historical
      - name: Four-way benchmark contract
        run: python3 tests/jev/benchmark.py --dataset historical --four-way
      - name: Limited DDS hard-rule policy adapter (coverage diagnostic)
        run: python3 tests/jev/four_way.py --dataset golden --arm dds_baseline --command "python3 tests/jev/dds_policy_adapter.py"
      - name: Cheap LLM provider adapter (unconfigured diagnostic)
        run: python3 tests/jev/four_way.py --dataset golden --arm cheap_llm --command "python3 tests/jev/cheap_llm_adapter.py"
      - name: Hybrid routing coverage diagnostic (providers unconfigured)
        run: python3 tests/jev/four_way.py --dataset golden --arm hybrid --command "python3 tests/jev/hybrid_adapter.py"
      - run: bash tests/validate-regression.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jev-offline-results
          path: tests/jev/results/
          if-no-files-found: warn

  live-jev:
    if: ${{ github.event_name != 'pull_request' && vars.JEV_LIVE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    needs: offline-validation
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install typesafe-sdk
      - run: python3 tests/jev/benchmark.py --provider jev --dataset golden
      - run: python3 tests/jev/benchmark.py --provider jev --dataset historical
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jev-live-results
          path: tests/jev/results/
          if-no-files-found: warn

  live-cheap-llm:
    if: ${{ github.event_name != 'pull_request' && vars.JEV_LIVE_ENABLED == 'true' && vars.CHEAP_LLM_LIVE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    needs: offline-validation
    env:
      CHEAP_LLM_PROVIDER_CMD: ${{ vars.CHEAP_LLM_PROVIDER_CMD }}
      CHEAP_LLM_API_URL: ${{ vars.CHEAP_LLM_API_URL }}
      CHEAP_LLM_API_KEY: ${{ secrets.CHEAP_LLM_API_KEY }}
      CHEAP_LLM_MODEL: ${{ vars.CHEAP_LLM_MODEL }}
      CHEAP_LLM_INPUT_USD_PER_MILLION: ${{ vars.CHEAP_LLM_INPUT_USD_PER_MILLION }}
      CHEAP_LLM_OUTPUT_USD_PER_MILLION: ${{ vars.CHEAP_LLM_OUTPUT_USD_PER_MILLION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run measured Cheap LLM adapter
        run: python3 tests/jev/four_way.py --dataset historical --arm cheap_llm --require-complete --command "python3 tests/jev/cheap_llm_adapter.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cheap-llm-live-results
          path: tests/jev/results/
          if-no-files-found: warn

  live-hybrid:
    if: ${{ github.event_name != 'pull_request' && vars.JEV_LIVE_ENABLED == 'true' && vars.CHEAP_LLM_LIVE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    needs: offline-validation
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      CHEAP_LLM_PROVIDER_CMD: ${{ vars.CHEAP_LLM_PROVIDER_CMD }}
      CHEAP_LLM_API_URL: ${{ vars.CHEAP_LLM_API_URL }}
      CHEAP_LLM_API_KEY: ${{ secrets.CHEAP_LLM_API_KEY }}
      CHEAP_LLM_MODEL: ${{ vars.CHEAP_LLM_MODEL }}
      CHEAP_LLM_INPUT_USD_PER_MILLION: ${{ vars.CHEAP_LLM_INPUT_USD_PER_MILLION }}
      CHEAP_LLM_OUTPUT_USD_PER_MILLION: ${{ vars.CHEAP_LLM_OUTPUT_USD_PER_MILLION }}
      HYBRID_JEV_CMD: python3 tests/jev/jev_adapter.py
      HYBRID_LLM_CMD: python3 tests/jev/cheap_llm_adapter.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install typesafe-sdk
      - name: Run measured Hybrid adapter
        run: python3 tests/jev/four_way.py --dataset historical --arm hybrid --require-complete --command "python3 tests/jev/hybrid_adapter.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hybrid-live-results
          path: tests/jev/results/
          if-no-files-found: warn
