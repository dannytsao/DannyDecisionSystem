name: Jev Value Validation

on:
  push:
    branches:
      - jev-value-validation
    paths:
      - "tests/jev/**"
      - "docs/JEV-VALUE-VALIDATION-PLAN.md"
      - ".github/workflows/jev-validation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "tests/jev/**"
      - "docs/JEV-VALUE-VALIDATION-PLAN.md"
      - ".github/workflows/jev-validation.yml"
  workflow_dispatch:

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest -v tests/jev/test_harness.py
      - run: python3 tests/jev/benchmark.py --provider fixture
      - run: bash tests/validate-regression.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jev-offline-results
          path: tests/jev/results/
          if-no-files-found: warn

  live-jev:
    if: ${{ vars.JEV_LIVE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    needs: offline-validation
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tests/jev/benchmark.py --provider jev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jev-live-results
          path: tests/jev/results/
          if-no-files-found: warn
